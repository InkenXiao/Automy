<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>艾宾浩斯背单词</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-frame">
  <!-- 左栏: 侧边导航 -->
  <aside class="app-frame__sidebar">
    <div class="sidebar__brand">
      <span class="brand__mark">📖</span>
      <span class="brand__text">艾宾浩斯背单词</span>
    </div>
    <nav class="sidebar__nav">
      <a class="nav-item active" data-view="dashboard">📊 仪表盘</a>
      <a class="nav-item" data-view="words">📚 单词库</a>
      <a class="nav-item" data-view="review">🔁 复习</a>
      <a class="nav-item" data-view="learn">✨ 学习新词</a>
      <a class="nav-item" data-view="stubborn">🔥 顽固词本</a>
    </nav>
    <div class="sidebar__footer">艾宾浩斯记忆法</div>
  </aside>

  <!-- 中栏: 主工作区 -->
  <main class="app-frame__main">
    <div id="view-dashboard" class="view active"></div>
    <div id="view-words" class="view"></div>
    <div id="view-review" class="view"></div>
    <div id="view-learn" class="view"></div>
    <div id="view-stubborn" class="view"></div>
  </main>

  <!-- 右栏: 详情面板 -->
  <aside class="app-frame__detail" id="detail-panel">
    <div class="detail-empty">点击单词查看详情</div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/words.js"></script>
<script src="js/review.js"></script>
<script src="js/learn.js"></script>
<script src="js/stubborn.js"></script>
</body>
</html>
