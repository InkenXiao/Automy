<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄圃 · 智枢</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 20% 30%, #ecfdf5 0%, #f5f7fa 55%, #eef2f7 100%);
    color: #2d3748; overflow: hidden;
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: .3; pointer-events: none; }
  .glow-1 { width: 480px; height: 480px; background: #6ee7b7; top: -120px; left: -120px; animation: drift 14s ease-in-out infinite alternate; }
  .glow-2 { width: 420px; height: 420px; background: #a7f3d0; bottom: -140px; right: -100px; animation: drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.15); } }
  .card {
    position: relative; z-index: 1; width: 400px; padding: 44px 40px 36px;
    background: rgba(255, 255, 255, .9); border: 1px solid rgba(16, 185, 129, .2);
    border-radius: 18px; backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(15, 23, 42, .1);
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(135deg, #10b981, #059669);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #fff;
    box-shadow: 0 6px 20px rgba(16,185,129,.35);
  }
  h1 { text-align: center; font-size: 22px; letter-spacing: 2px;
       background: linear-gradient(90deg, #10b981, #059669); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { text-align: center; font-size: 13px; color: #64748b; margin: 8px 0 30px; letter-spacing: 1px; }
  .input {
    width: 100%; padding: 13px 16px; margin-bottom: 14px; font-size: 14px;
    background: #ffffff; border: 1px solid rgba(100, 116, 139, .3);
    border-radius: 10px; color: #2d3748; outline: none; transition: border .2s, box-shadow .2s;
  }
  .input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.14); }
  .btn {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600; letter-spacing: 4px;
    border: none; border-radius: 10px; cursor: pointer; color: #fff;
    background: linear-gradient(90deg, #10b981, #059669); transition: transform .15s, box-shadow .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(16,185,129,.35); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .hint { min-height: 20px; margin-top: 12px; font-size: 12px; color: #ef4444; text-align: center; }
  .back { display: block; text-align: center; margin-top: 18px; font-size: 12px; color: #64748b; text-decoration: none; }
  .back:hover { color: #10b981; }
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="card">
  <div class="logo">R</div>
  <h1>玄圃 · 智枢</h1>
  <div class="sub">知 识 库 平 台 · 身 份 确 认</div>
  <input class="input" id="name" type="text" placeholder="请输入姓名" autocomplete="off">
  <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="off" style="display:none;">
  <button class="btn" id="login-btn">进 入</button>
  <div class="hint" id="hint"></div>
  <a class="back" href="/" onclick="return false" id="back-link" style="display:none;">← 返回统一入口</a>
</div>
<script>
const nameInput = document.getElementById('name');
const pwdInput = document.getElementById('password');
const btn = document.getElementById('login-btn');
const hint = document.getElementById('hint');
let needPassword = false;

// 已登录直接进主页
if ((localStorage.getItem('rag_user') || '').trim()) {
  location.replace('index.html');
}

async function doLogin() {
  const name = (nameInput.value || '').trim();
  if (!name) { hint.textContent = '请输入姓名'; nameInput.focus(); return; }
  const password = needPassword ? (pwdInput.value || '') : '';
  if (needPassword && !password) { hint.textContent = '请输入密码'; pwdInput.focus(); return; }
  btn.disabled = true;
  hint.textContent = '正在确认身份...';
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password: password || null })
    });
    const res = await resp.json();
    if (res && res.need_password) {
      needPassword = true;
      pwdInput.style.display = '';
      pwdInput.value = '';
      hint.textContent = '该用户已设置密码, 请输入密码';
      btn.disabled = false;
      pwdInput.focus();
      return;
    }
    if (!resp.ok) {
      throw new Error((res && res.detail) || `登录失败 (${resp.status})`);
    }
    if (!res || !res.ok) {
      hint.textContent = (res && res.msg) || '用户未注册, 请联系管理员';
      btn.disabled = false;
      return;
    }
    localStorage.setItem('rag_user', res.name);
    localStorage.setItem('rag_user_id', res.user_id);
    localStorage.setItem('rag_user_dept', res.department || '');
    location.replace('index.html');
  } catch (err) {
    hint.textContent = err.message || '登录失败';
    btn.disabled = false;
    if (needPassword) { pwdInput.value = ''; pwdInput.focus(); }
  }
}

btn.addEventListener('click', doLogin);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
nameInput.focus();
</script>
</body>
</html>
