<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智创 · 智创</title>
  <link rel="icon" type="image/png" href="images/XIN.png">
  <link rel="stylesheet" href="css/workbench.css?v=20260809a">
  <link rel="stylesheet" href="css/cowork.css?v=20260809a">
</head>
<body>
<div class="app-frame">
  <!-- 左栏: 侧边导航 -->
  <aside class="app-frame__sidebar">
    <div class="sidebar__brand">
      <div class="brand__mark">P</div>
      <span class="brand__text">玄圃 · 智创</span>
    </div>
    <nav class="sidebar__nav">
      <a class="nav-item active" data-view="home" title="个人工作台: 待办、长任务结果与自定义看板">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">首页</span>
      </a>

      <!-- 智能工作台 (默认展开) -->
      <div class="nav-group">
        <div class="nav-group__title" data-group-toggle>
          <span>智能工作台</span>
          <span class="nav-group__chevron">▾</span>
        </div>
        <div class="nav-group__items">
          <a class="nav-item" data-view="tasks" title="AI驱动的任务自动流转与状态联动">
            <span class="nav-icon">🔄</span>
            <span class="nav-text">新任务</span>
          </a>
          <a class="nav-item" data-view="agents" title="具备记忆与技能的主动式数字员工">
            <span class="nav-icon">👤✨</span>
            <span class="nav-text">数字分身</span>
          </a>
          <a class="nav-item" data-view="skills" title="可复用、可编排的项目管理技能模块">
            <span class="nav-icon">🧩</span>
            <span class="nav-text">技能库</span>
          </a>
        </div>
      </div>

      <!-- 项目驾驶舱 (默认展开) -->
      <div class="nav-group">
        <div class="nav-group__title" data-group-toggle>
          <span>项目驾驶舱</span>
          <span class="nav-group__chevron">▾</span>
        </div>
        <div class="nav-group__items">
          <a class="nav-item" data-view="progress-plan" title="关键节点交付追踪与风险预警">
            <span class="nav-icon">🚩</span>
            <span class="nav-text">里程碑</span>
          </a>
          <a class="nav-item" data-view="meeting" title="会议-任务-纪要AI联动协同">
            <span class="nav-icon">📅</span>
            <span class="nav-text">项目会议</span>
          </a>
          <a class="nav-item" data-view="weekly-report" title="AI自动提炼项目进展与待办">
            <span class="nav-icon">📝</span>
            <span class="nav-text">项目周报</span>
          </a>
          <a class="nav-item" data-view="work-tasks" title="AI筛选的本周核心目标与优先级">
            <span class="nav-icon">🎯</span>
            <span class="nav-text">周任务</span>
          </a>
          <a class="nav-item" data-view="project-team" title="项目与项目成员维护">
            <span class="nav-icon">👥</span>
            <span class="nav-text">项目成员</span>
          </a>
          <a class="nav-item" data-view="personal-report" title="个人周报填写: 本周工作内容与下周工作计划">
            <span class="nav-icon">✍️</span>
            <span class="nav-text">个人周报</span>
          </a>
        </div>
      </div>

      <!-- 玄圃工坊 (默认折叠) -->
      <div class="nav-group nav-group--collapsed">
        <div class="nav-group__title" data-group-toggle>
          <span>玄圃工坊</span>
          <span class="nav-group__chevron">▾</span>
        </div>
        <div class="nav-group__items">
          <a class="nav-item" data-view="builder" title="配置数字员工人设、技能与行为规则">
            <span class="nav-icon">🎭</span>
            <span class="nav-text">分身</span>
          </a>
          <a class="nav-item" data-view="skill-builder" title="组装、调试并发布项目管理技能">
            <span class="nav-icon">⚙️🧩</span>
            <span class="nav-text">技能</span>
          </a>
          <a class="nav-item" data-view="memories" title="结构化沉淀项目知识与历史经验">
            <span class="nav-icon">🕸️🧠</span>
            <span class="nav-text">知识</span>
          </a>
        </div>
      </div>

      <!-- 系统管理 (默认折叠) -->
      <div class="nav-group nav-group--collapsed">
        <div class="nav-group__title" data-group-toggle>
          <span>系统管理</span>
          <span class="nav-group__chevron">▾</span>
        </div>
        <div class="nav-group__items">
          <a class="nav-item" data-view="usage-logs" title="登录与操作记录、LLM 调用与 token 统计">
            <span class="nav-icon">📈</span>
            <span class="nav-text">使用日志</span>
          </a>
        </div>
      </div>
    </nav>
    <div class="sidebar__week-selector">
      <div class="week-custom">
        <select id="week-year" title="选择年份"></select>
        <span class="week-sep">年</span>
        <select id="week-num" title="选择周次"></select>
        <span class="week-sep">周</span>
      </div>
      <input type="week" id="week-picker" hidden>
    </div>
    <!-- <div class="sidebar__footer">XUANPU · 玄圃智创</div> -->
  </aside>

  <!-- 中栏: 主工作区 -->
  <main class="app-frame__main">
    <div id="view-home" class="view active"></div>
    <div id="view-tasks" class="view"></div>
    <div id="view-progress-plan" class="view"></div>
    <div id="view-meeting" class="view"></div>
    <div id="view-weekly-report" class="view"></div>
    <div id="view-work-tasks" class="view"></div>
    <div id="view-project-team" class="view"></div>
    <div id="view-personal-report" class="view"></div>
    <div id="view-agents" class="view"></div>
    <div id="view-agent-chat" class="view"></div>
    <div id="view-builder" class="view"></div>
    <div id="view-skills" class="view"></div>
    <div id="view-skill-builder" class="view"></div>
    <div id="view-memories" class="view"></div>
    <div id="view-usage-logs" class="view"></div>
  </main>

  <!-- 右栏: 关联详情面板 -->
  <aside class="app-frame__right" id="detail-panel">
    <div class="detail-empty">点击任务查看关联详情</div>
  </aside>
</div>
<script src="js/lib/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="js/api.js?v=20260809a"></script>
<script src="js/auth.js?v=20260809a"></script>
<script src="js/home.js?v=20260809a"></script>
<script src="js/weekly-report.js?v=20260809a"></script>
<script src="js/progress-plan.js?v=20260809a"></script>
<script src="js/work-tasks.js?v=20260809a"></script>
<script src="js/meeting.js?v=20260809a"></script>
<script src="js/project-team.js?v=20260809a"></script>
<script src="js/personal-report.js?v=20260809a"></script>
<script src="js/cowork.js?v=20260809a"></script>
<script src="js/usage-logs.js?v=20260809a"></script>
<script src="js/app.js?v=20260809a"></script>
</body>
</html>
