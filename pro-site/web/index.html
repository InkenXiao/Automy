<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIN · 项目管理工作台</title>
  <link rel="icon" type="image/png" href="images/XIN.png">
  <link rel="stylesheet" href="css/workbench.css?v=20260725c">
</head>
<body>
<div class="app-frame">
  <!-- 左栏: 侧边导航 -->
  <aside class="app-frame__sidebar">
    <div class="sidebar__brand">
      <img class="brand__mark" src="images/XIN.png" alt="XIN">
      <span class="brand__text">项目管理工作台</span>
    </div>
    <nav class="sidebar__nav">
      <a class="nav-item active" data-view="progress-plan">📊 进度计划</a>
      <a class="nav-item" data-view="meeting">📅 项目会议</a>
      <a class="nav-item" data-view="weekly-report">📋 项目周报</a>
      <a class="nav-item" data-view="work-tasks">✅ 每周任务</a>
    </nav>
    <div class="sidebar__week-selector">
      <input type="week" id="week-picker">
    </div>
    <div class="sidebar__footer">XIN · 信</div>
  </aside>

  <!-- 中栏: 主工作区 -->
  <main class="app-frame__main">
    <div id="view-progress-plan" class="view active"></div>
    <div id="view-meeting" class="view"></div>
    <div id="view-weekly-report" class="view"></div>
    <div id="view-work-tasks" class="view"></div>
  </main>

  <!-- 右栏: 关联详情面板 -->
  <aside class="app-frame__right" id="detail-panel">
    <div class="detail-empty">点击任务查看关联详情</div>
  </aside>
</div>
<script src="js/lib/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="js/api.js?v=20260728b"></script>
<script src="js/weekly-report.js?v=20260728b"></script>
<script src="js/progress-plan.js?v=20260728b"></script>
<script src="js/work-tasks.js?v=20260728b"></script>
<script src="js/meeting.js?v=20260728b"></script>
<script src="js/app.js?v=20260728b"></script>
</body>
</html>
