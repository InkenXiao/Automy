<!-- ============================================================
     XIN 信 · CoWork AI 工作台主页
     三栏布局: 左侧导航(由 cowork.js 的 renderSidebar 动态渲染)
     + 中间 Agent 对话区 + 右侧面板区(4 个可折叠面板)
     通过 Hash 路由懒加载,仅包含 body 内容
     ============================================================ -->
<link rel="stylesheet" href="../../assets/css/cowork.css" />

<div class="cowork-layout" id="cowork-layout">
  <!-- 左侧导航: 占位,由 cowork.js 的 renderSidebar 动态渲染 -->
  <aside class="cowork-sidebar" id="cowork-sidebar"></aside>

  <!-- 中间: Agent 对话区 -->
  <main class="cowork-main" id="cowork-main">
    <!-- 顶部: 当前 Agent 名称 + Agent 选择下拉 + 新会话按钮 -->
    <header class="cowork-main__header" style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
      <div style="min-width:0;">
        <div id="chat-agent-name" style="font-size:15px;font-weight:600;color:var(--color-text);">未选择 Agent</div>
        <div class="text-muted" style="font-size:12px;">选择一个 Agent 开始对话</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
        <select id="agent-select" class="builder-form__select" style="width:auto;min-width:160px;" aria-label="选择 Agent">
          <option value="">选择 Agent...</option>
        </select>
        <button class="btn btn-primary btn-sm" id="new-session-btn">＋ 新会话</button>
      </div>
    </header>

    <!-- 消息列表区 -->
    <div class="chat-container" id="chat-messages">
      <div class="cowork-empty">
        <div class="cowork-empty__icon">💬</div>
        <div class="cowork-empty__title">开始新的对话</div>
        <div class="cowork-empty__desc">从右上角选择一个 Agent,在下方输入消息开始智能协作。</div>
      </div>
    </div>

    <!-- 底部输入区: 工具按钮 + 输入框 + 发送按钮 -->
    <div class="chat-input-area">
      <button class="btn btn-ghost btn-icon" id="chat-tools-btn" title="工具" aria-label="工具">🛠️</button>
      <textarea class="chat-input" id="chat-input" rows="1" placeholder="输入消息,Enter 发送,Shift+Enter 换行..."></textarea>
      <button class="chat-send-btn" id="chat-send-btn" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </main>

  <!-- 右侧: 面板区(Agent 信息 / 上下文 / 记忆 / 工具日志,可折叠) -->
  <aside class="cowork-panel" id="cowork-panel">
    <section class="cowork-panel-section">
      <button class="cowork-panel-section__header" type="button">
        <span>Agent 信息</span>
        <svg class="cowork-panel-section__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="cowork-panel-section__body" id="panel-agent-info">
        <dl style="margin:0;">
          <div class="cowork-panel__kv"><dt>名称</dt><dd id="panel-agent-name">—</dd></div>
          <div class="cowork-panel__kv"><dt>类型</dt><dd id="panel-agent-type">—</dd></div>
          <div class="cowork-panel__kv"><dt>状态</dt><dd id="panel-agent-status">—</dd></div>
          <div class="cowork-panel__kv"><dt>工具数</dt><dd id="panel-agent-tools">—</dd></div>
        </dl>
      </div>
    </section>

    <section class="cowork-panel-section">
      <button class="cowork-panel-section__header" type="button">
        <span>上下文</span>
        <svg class="cowork-panel-section__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="cowork-panel-section__body" id="panel-context">
        <div class="text-muted">暂无上下文。</div>
      </div>
    </section>

    <section class="cowork-panel-section">
      <button class="cowork-panel-section__header" type="button">
        <span>记忆</span>
        <svg class="cowork-panel-section__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="cowork-panel-section__body" id="panel-memory">
        <div class="text-muted">暂无记忆。</div>
      </div>
    </section>

    <section class="cowork-panel-section">
      <button class="cowork-panel-section__header" type="button">
        <span>工具日志</span>
        <svg class="cowork-panel-section__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="cowork-panel-section__body" id="panel-tool-logs">
        <div class="text-muted">暂无工具调用记录。</div>
      </div>
    </section>
  </aside>
</div>

<script type="module">
  import { cowork } from '../../assets/js/cowork.js';

  // 初始化 CoWork 工作台(由 cowork.js 渲染侧栏并接管对话区与面板)
  cowork.loadWorkspace();

  // 右侧面板折叠 / 展开
  document.querySelectorAll('.cowork-panel-section__header').forEach((btn) => {
    btn.addEventListener('click', () => {
      btn.closest('.cowork-panel-section')?.classList.toggle('collapsed');
    });
  });
</script>
