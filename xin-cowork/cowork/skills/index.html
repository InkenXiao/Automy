<!-- ============================================================
     XIN 信 · CoWork Skill 列表页(技能管理)
     通过 Hash 路由懒加载,仅包含 body 内容
     ============================================================ -->
<link rel="stylesheet" href="../../assets/css/cowork.css" />

<div class="cowork-main__scroll">
  <!-- 页面标题 + 操作栏 -->
  <div class="cowork-page-header" style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;">
    <div>
      <h2 style="margin:0;font-size:20px;">技能管理</h2>
      <p class="text-muted" style="margin:4px 0 0;font-size:13px;">编排可复用的技能,供 Agent 调用执行。</p>
    </div>
    <a href="#/cowork/skills/builder" class="btn btn-primary">＋ 新建 Skill</a>
  </div>

  <!-- Skill 卡片网格 -->
  <div id="skill-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;">
    <div class="cowork-loading cowork-loading--block">
      <span class="cowork-loading__spinner"></span>
      <span>加载中...</span>
    </div>
  </div>
</div>

<script type="module">
  import { agentApi } from '../../assets/js/agent-api.js';

  /** 触发类型中文名 */
  const TRIGGER_LABELS = {
    manual: '手动触发',
    intent: '意图识别',
    schedule: '定时触发'
  };

  const listEl = document.getElementById('skill-list');

  /** HTML 转义 */
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** 加载 Skill 列表并渲染 */
  async function loadSkills() {
    listEl.innerHTML = `
      <div class="cowork-loading cowork-loading--block">
        <span class="cowork-loading__spinner"></span>
        <span>加载中...</span>
      </div>`;
    try {
      const skills = await agentApi.getSkills();
      renderSkills(Array.isArray(skills) ? skills : []);
    } catch (err) {
      console.error('[CoWork] 加载 Skill 列表失败:', err);
      listEl.innerHTML = `<div class="alert alert-danger">加载失败: ${esc(err.message)}</div>`;
    }
  }

  /** 渲染 Skill 卡片网格 */
  function renderSkills(skills) {
    if (skills.length === 0) {
      listEl.innerHTML = `
        <div class="cowork-empty" style="grid-column:1/-1;">
          <div class="cowork-empty__icon">⚡</div>
          <div class="cowork-empty__title">暂无 Skill</div>
          <div class="cowork-empty__desc">创建你的第一个 Skill,沉淀可复用的工作能力。</div>
          <a href="#/cowork/skills/builder" class="btn btn-primary">新建 Skill</a>
        </div>`;
      return;
    }
    listEl.innerHTML = skills.map((s) => {
      const active = s.is_active !== false;
      return `
        <div class="skill-card" data-skill-id="${s.id}">
          <div class="skill-card__header">
            <div class="skill-card__icon">⚡</div>
            <div style="min-width:0;">
              <div class="skill-card__name">${esc(s.name || '未命名技能')}</div>
              <span class="badge badge-primary">${esc(s.category || '未分类')}</span>
              <span class="badge badge-info">${esc(TRIGGER_LABELS[s.trigger_type] || s.trigger_type || '手动触发')}</span>
            </div>
          </div>
          <div class="skill-card__desc">${esc(s.description || '暂无描述')}</div>
          <div class="skill-card__footer">
            <span class="agent-card__status agent-card__status--${active ? 'active' : 'inactive'}">${active ? '已启用' : '已停用'}</span>
            <span style="display:flex;gap:8px;">
              <a class="btn btn-ghost btn-sm" href="#/cowork/skills/builder?id=${s.id}" data-action="edit">编辑</a>
              <button class="btn btn-danger btn-sm" data-action="delete" data-id="${s.id}">删除</button>
            </span>
          </div>
        </div>`;
    }).join('');

    // 卡片点击跳详情(操作按钮除外)
    listEl.querySelectorAll('.skill-card').forEach((card) => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-action]')) return;
        window.location.hash = `#/cowork/skills/${card.dataset.skillId}`;
      });
    });
    // 删除按钮
    listEl.querySelectorAll('[data-action="delete"]').forEach((btn) => {
      btn.addEventListener('click', () => deleteSkill(btn.dataset.id));
    });
  }

  /** 删除 Skill 后刷新列表 */
  async function deleteSkill(id) {
    if (!confirm('确定删除该 Skill 吗?删除后不可恢复。')) return;
    try {
      await agentApi.deleteSkill(id);
      loadSkills();
    } catch (err) {
      console.error('[CoWork] 删除 Skill 失败:', err);
      alert('删除失败: ' + err.message);
    }
  }

  loadSkills();
  document.title = '技能管理 · CoWork · XIN';
</script>
