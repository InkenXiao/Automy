<!-- ============================================================
     XIN 信 · CoWork Skill 构建器(新建 / 编辑)
     表单: 名称、描述、分类、触发类型、工具链步骤、执行代码
     由 skill-builder.js 渲染表单并处理保存 / 测试逻辑
     通过 Hash 路由懒加载,仅包含 body 内容
     编辑模式: #/cowork/skills/builder?id=<skillId>
     ============================================================ -->
<link rel="stylesheet" href="../../assets/css/cowork.css" />

<div class="cowork-main__scroll">
  <!-- 页面标题 -->
  <div class="cowork-page-header" style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;">
    <div>
      <h2 style="margin:0;font-size:20px;">Skill 构建器</h2>
      <p class="text-muted" style="margin:4px 0 0;font-size:13px;">编排工具链步骤与执行代码,沉淀可复用的技能。</p>
    </div>
    <a href="#/cowork/skills" class="btn btn-ghost">返回列表</a>
  </div>

  <!-- Skill 构建器容器(由 skillBuilder 渲染: 名称/描述/分类/触发类型/工具链步骤/执行代码 + 保存/测试按钮) -->
  <div id="skill-builder-root">
    <div class="cowork-loading cowork-loading--block">
      <span class="cowork-loading__spinner"></span>
      <span>加载中...</span>
    </div>
  </div>
</div>

<script type="module">
  import { skillBuilder } from '../../assets/js/skill-builder.js';

  /** 从 hash 中解析查询参数 */
  function getHashParam(name) {
    const match = location.hash.match(new RegExp('[?&]' + name + '=([^&]+)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  // 初始化 Skill 构建器(传入 ID 时为编辑模式,否则新建)
  skillBuilder.init(document.getElementById('skill-builder-root'), getHashParam('id') || undefined);
  document.title = 'Skill 构建器 · CoWork · XIN';
</script>
