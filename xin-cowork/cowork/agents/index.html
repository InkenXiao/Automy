<!-- ============================================================
     XIN 信 · CoWork Agent 列表页(智能体管理)
     通过 Hash 路由懒加载,仅包含 body 内容
     ============================================================ -->
<link rel="stylesheet" href="../../assets/css/cowork.css" />

<div class="cowork-main__scroll">
  <!-- 页面标题 + 操作栏 -->
  <div class="cowork-page-header" style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;">
    <div>
      <h2 style="margin:0;font-size:20px;">智能体管理</h2>
      <p class="text-muted" style="margin:4px 0 0;font-size:13px;">创建、编辑并管理你的 Agent。</p>
    </div>
    <a href="#/cowork/agents/builder" class="btn btn-primary">＋ 新建 Agent</a>
  </div>

  <!-- Agent 卡片网格 -->
  <div id="agent-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;">
    <div class="cowork-loading cowork-loading--block">
      <span class="cowork-loading__spinner"></span>
      <span>加载中...</span>
    </div>
  </div>
</div>

<script type="module">
  import { agentApi } from '../../assets/js/agent-api.js';

  /** Agent 类型元信息(图标 + 中文名) */
  const TYPE_META = {
    progress: { icon: '📈', label: '进度跟踪' },
    meeting: { icon: '🎙️', label: '会议纪要' },
    weekly_report: { icon: '📊', label: '周报' },
    work_plan: { icon: '🗓️', label: '工作计划' },
    custom: { icon: '🤖', label: '自定义' }
  };

  const listEl = document.getElementById('agent-list');

  /** HTML 转义 */
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** 加载 Agent 列表并渲染 */
  async function loadAgents() {
    listEl.innerHTML = `
      <div class="cowork-loading cowork-loading--block">
        <span class="cowork-loading__spinner"></span>
        <span>加载中...</span>
      </div>`;
    try {
      const agents = await agentApi.getAgents();
      renderAgents(Array.isArray(agents) ? agents : []);
    } catch (err) {
      console.error('[CoWork] 加载 Agent 列表失败:', err);
      listEl.innerHTML = `<div class="alert alert-danger">加载失败: ${esc(err.message)}</div>`;
    }
  }

  /** 渲染 Agent 卡片网格 */
  function renderAgents(agents) {
    if (agents.length === 0) {
      listEl.innerHTML = `
        <div class="cowork-empty" style="grid-column:1/-1;">
          <div class="cowork-empty__icon">🤖</div>
          <div class="cowork-empty__title">暂无 Agent</div>
          <div class="cowork-empty__desc">创建你的第一个 Agent,开始智能协作。</div>
          <a href="#/cowork/agents/builder" class="btn btn-primary">新建 Agent</a>
        </div>`;
      return;
    }
    listEl.innerHTML = agents.map((a) => {
      const meta = TYPE_META[a.type] || TYPE_META.custom;
      const active = a.is_active !== false;
      return `
        <div class="agent-card" data-agent-id="${a.id}">
          <div class="agent-card__header">
            <div class="agent-card__icon">${meta.icon}</div>
            <div style="min-width:0;">
              <div class="agent-card__name">${esc(a.name || '未命名 Agent')}</div>
              <span class="agent-type-badge">${esc(meta.label)}</span>
            </div>
          </div>
          <div class="agent-card__desc">${esc(a.description || '暂无描述')}</div>
          <div class="agent-card__footer">
            <span class="agent-card__status agent-card__status--${active ? 'active' : 'inactive'}">${active ? '运行中' : '已停用'}</span>
            <span style="display:flex;gap:8px;">
              <a class="btn btn-ghost btn-sm" href="#/cowork/agents/builder?id=${a.id}" data-action="edit">编辑</a>
              <button class="btn btn-danger btn-sm" data-action="delete" data-id="${a.id}">删除</button>
            </span>
          </div>
        </div>`;
    }).join('');

    // 卡片点击跳详情(操作按钮除外)
    listEl.querySelectorAll('.agent-card').forEach((card) => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-action]')) return;
        window.location.hash = `#/cowork/agents/${card.dataset.agentId}`;
      });
    });
    // 删除按钮
    listEl.querySelectorAll('[data-action="delete"]').forEach((btn) => {
      btn.addEventListener('click', () => deleteAgent(btn.dataset.id));
    });
  }

  /** 删除 Agent 后刷新列表 */
  async function deleteAgent(id) {
    if (!confirm('确定删除该 Agent 吗?删除后不可恢复。')) return;
    try {
      await agentApi.deleteAgent(id);
      loadAgents();
    } catch (err) {
      console.error('[CoWork] 删除 Agent 失败:', err);
      alert('删除失败: ' + err.message);
    }
  }

  loadAgents();
  document.title = '智能体管理 · CoWork · XIN';
</script>
