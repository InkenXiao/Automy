<!-- ============================================================
     XIN 信 · CoWork Agent 详情 / 调试页
     左侧: Agent 信息展示; 右侧: 调试对话区
     通过 Hash 路由懒加载,仅包含 body 内容
     路由: #/cowork/agents/<agentId>
     ============================================================ -->
<link rel="stylesheet" href="../../assets/css/cowork.css" />

<div class="cowork-main__scroll">
  <!-- 页面标题 -->
  <div class="cowork-page-header" style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;">
    <div>
      <h2 style="margin:0;font-size:20px;" id="agent-detail-title">Agent 详情</h2>
      <p class="text-muted" style="margin:4px 0 0;font-size:13px;">查看 Agent 配置,并在右侧进行调试对话。</p>
    </div>
    <div style="display:flex;gap:12px;flex-shrink:0;">
      <a href="#/cowork/agents" class="btn btn-ghost">返回列表</a>
      <a href="#/cowork/agents/builder" id="agent-edit-link" class="btn btn-primary">编辑</a>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start;">
    <!-- 左侧: Agent 信息展示 -->
    <div id="agent-info">
      <div class="cowork-loading cowork-loading--block">
        <span class="cowork-loading__spinner"></span>
        <span>加载中...</span>
      </div>
    </div>

    <!-- 右侧: 调试对话区 -->
    <div style="display:flex;flex-direction:column;height:560px;border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;background:var(--color-bg);">
      <div style="padding:12px 16px;border-bottom:1px solid var(--color-border-light);font-weight:600;font-size:14px;flex-shrink:0;">
        调试对话
      </div>
      <div class="chat-container" id="debug-chat-messages" style="padding:16px;">
        <div class="cowork-empty">
          <div class="cowork-empty__icon">🧪</div>
          <div class="cowork-empty__title">调试模式</div>
          <div class="cowork-empty__desc">在下方输入消息,验证 Agent 的回复效果。</div>
        </div>
      </div>
      <div class="chat-input-area" style="padding:12px 16px;">
        <textarea class="chat-input" id="debug-chat-input" rows="1" placeholder="输入消息,Enter 发送..."></textarea>
        <button class="chat-send-btn" id="debug-send-btn" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { agentApi } from '../../assets/js/agent-api.js';
  import { agentEngine } from '../../assets/js/agent-engine.js';

  /** Agent 类型元信息(图标 + 中文名) */
  const TYPE_META = {
    progress: { icon: '📈', label: '进度跟踪' },
    meeting: { icon: '🎙️', label: '会议纪要' },
    weekly_report: { icon: '📊', label: '周报' },
    work_plan: { icon: '🗓️', label: '工作计划' },
    custom: { icon: '🤖', label: '自定义' }
  };

  const infoEl = document.getElementById('agent-info');
  const messagesEl = document.getElementById('debug-chat-messages');
  const inputEl = document.getElementById('debug-chat-input');

  /** HTML 转义 */
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** 从 hash 路径中解析 Agent ID (#/cowork/agents/<id>) */
  function getAgentId() {
    const match = location.hash.match(/#\/cowork\/agents\/(\d+)/);
    return match ? match[1] : null;
  }

  /** 渲染 Agent 信息(名称、类型、描述、系统提示词、工具列表) */
  function renderAgentInfo(agent) {
    const meta = TYPE_META[agent.type] || TYPE_META.custom;
    const active = agent.is_active !== false;
    const tools = Array.isArray(agent.tools) ? agent.tools : [];
    document.getElementById('agent-detail-title').textContent = agent.name || 'Agent 详情';
    document.getElementById('agent-edit-link').href = `#/cowork/agents/builder?id=${agent.id}`;
    infoEl.innerHTML = `
      <div class="card"><div class="card-body">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div class="agent-card__icon">${meta.icon}</div>
          <div style="min-width:0;">
            <div style="font-size:16px;font-weight:600;">${esc(agent.name || '未命名 Agent')}</div>
            <span class="agent-type-badge">${esc(meta.label)}</span>
            <span class="agent-card__status agent-card__status--${active ? 'active' : 'inactive'}" style="margin-left:8px;">${active ? '运行中' : '已停用'}</span>
          </div>
        </div>

        <div style="font-weight:600;font-size:13px;margin-bottom:4px;">描述</div>
        <p class="text-muted" style="font-size:13px;margin:0 0 16px;">${esc(agent.description || '暂无描述')}</p>

        <div style="font-weight:600;font-size:13px;margin-bottom:4px;">系统提示词</div>
        <pre style="background:var(--color-bg-subtle);border:1px solid var(--color-border-light);border-radius:var(--radius-md);padding:12px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin:0 0 16px;max-height:200px;overflow-y:auto;">${esc(agent.system_prompt || '(未设置)')}</pre>

        <div style="font-weight:600;font-size:13px;margin-bottom:8px;">工具列表 (${tools.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${tools.length
            ? tools.map((t) => `<span class="badge">${esc(t)}</span>`).join('')
            : '<span class="text-muted" style="font-size:13px;">未配置工具</span>'}
        </div>
      </div></div>`;
  }

  /** 发送调试消息 */
  function sendDebugMessage() {
    const content = inputEl.value.trim();
    if (!content) return;
    inputEl.value = '';
    agentEngine.sendMessage(content);
  }

  /** 加载 Agent 详情并初始化调试对话 */
  async function loadAgentDetail() {
    const agentId = getAgentId();
    if (!agentId) {
      infoEl.innerHTML = '<div class="alert alert-warning">缺少 Agent ID。</div>';
      return;
    }
    try {
      const agent = await agentApi.getAgent(agentId);
      renderAgentInfo(agent);
      // 初始化调试对话(加载最近会话的消息历史)
      agentEngine.init(messagesEl);
      agentEngine.selectAgent(agent);
    } catch (err) {
      console.error('[CoWork] 加载 Agent 详情失败:', err);
      infoEl.innerHTML = `<div class="alert alert-danger">加载失败: ${esc(err.message)}</div>`;
    }
  }

  document.getElementById('debug-send-btn').addEventListener('click', sendDebugMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendDebugMessage();
    }
  });

  loadAgentDetail();
  document.title = 'Agent 详情 · CoWork · XIN';
</script>
